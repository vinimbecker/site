services:
  php: 
    build: 
      context: .
      dockerfile: Dockerfile/php.dockerfile
    container_name: backend
    depends_on:
      - mysql
    networks: 
      - site_network
    ports:
      - "8085:80"
    volumes:
      - ./back/:/var/www/html/
      - "./apache/sites-enabled/:/etc/apache2/sites-enabled/"
    environment: 
      MYSQL_HOST: mysql
      MYSQL_DATABASE: site
      MYSQL_PASSWORD: user
      MYSQL_USER: user

  node:
    build:
      context: .
      dockerfile: Dockerfile/node.dockerfile
    container_name: frontend
    stdin_open: true
    tty: true
    command: sh -c "npm i && npm run dev"
    networks:
      - site_network
    volumes:
      - ./front:/home/node/app
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: 'true' 

  mysql:
    image: mysql:8.0
    container_name: database
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: site
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: user
      MYSQL_USER: user
    volumes:
      - "./db:/home/bkp"
      - "mysql_db:/var/lib/mysql"
    networks:
      - site_network    

  #PhpMyAdmin
  dbadmin:
    image: phpmyadmin/phpmyadmin
    restart: "no"
    container_name: phpmyadmin
    ports:
      - "4033:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - site_network    

volumes:
  mysql_db:
    driver: "local"  

networks:
  site_network:
    driver: bridge      