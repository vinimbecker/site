services:
  node:
    build:
      context: .
      dockerfile: Dockerfile/node.dockerfile
    container_name: frontend
    stdin_open: true
    tty: true
    command: sh -c "npm i && npm run dev"
    volumes:
      - ./front:/home/node/app
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: 'true' 